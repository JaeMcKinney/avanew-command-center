<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ava</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#06101D;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  tavus-embed{width:100%;height:100%;display:block}
</style>
</head>
<body>
<script>
// Hard camera kill: strip video from every getUserMedia request so the
// visitor's camera can never activate, on any browser. Mic is untouched.
(function(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  var orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
  navigator.mediaDevices.getUserMedia = function(constraints){
    var c = Object.assign({}, constraints || {});
    if (c.video) {
      if (!c.audio) {
        return Promise.reject(new DOMException('Camera disabled on this page', 'NotAllowedError'));
      }
      delete c.video;
    }
    return orig(c);
  };
})();
</script>
<div id="wrap">
  <tavus-embed deployment-id="f6fe8fae-d897-4772-97df-ad7b6011c7ef"></tavus-embed>
</div>
<script src="https://unpkg.com/@tavus/embed"></script>
</body>
</html>
